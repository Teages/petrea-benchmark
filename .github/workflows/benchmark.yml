name: benchmark

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      # zena (the compiler for typestrip's wasm engine) needs Node.js 25 to
      # build; the bench itself runs on the pinned Node 24 below.
      - uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Cache the zena build workspace
        uses: actions/cache@v4
        with:
          path: .build/zena
          key: typestrip-zena-${{ hashFiles('build-typestrip-wasm.sh') }}

      - name: Build typestrip wasm engine from pinned sources
        run: npm run build:typestrip-wasm

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build oxidase native binding from the patched submodule
        run: sh build-oxidase-native.sh

      - name: Build corpus
        run: node prepare.mjs

      - name: Run benchmark
        run: |
          set -o pipefail
          npx vitest bench --run 2>&1 | tee bench-output.txt

      - name: Regenerate README results
        run: node scripts/update-readme.mjs

      - name: Commit refreshed results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md bench-output.txt corpus.json corpus-excluded.json
          git diff --cached --quiet || git commit -m "chore: refresh benchmark results [skip ci]"
          git push
